<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S15 生成进度 · VR留念</title>
<!-- 字号 px 等值;FR-04:百分比+阶段文字;取消按比例退款;失败全额退+重试免重配置;演示值 -4;D-063:FA 图标+真实计时(A-732/735) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.spin{animation:spin 2.8s linear infinite}
@keyframes spin{from{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.06)}to{transform:rotate(360deg) scale(1)}}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-6">
    <div class="flex items-center gap-2.5 mt-1">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[22px] font-black">正在生成</h1>
      <span class="chip ml-auto shrink-0" style="background:rgba(255,107,74,.12);color:#C2410C"><i class="fa-solid fa-coins text-[11px]"></i>76</span>
    </div>
    <p class="text-[13px] text-[#6F6259] font-semibold num mt-1 ml-[46px]">已用 54s · 预计还需约 40s · 通常 30–120 秒</p>

    <!-- 中央:沙漏贴纸 + 超大百分比(Z3) -->
    <div class="flex flex-col items-center mt-8">
      <div class="w-[110px] h-[110px] rounded-[32px] border-2 border-[#1A1410] flex items-center justify-center text-[52px] spin text-white" style="background:linear-gradient(135deg,#FF8A6E,#FFB347);box-shadow:5px 5px 0 #1A1410"><i class="fa-solid fa-hourglass-half"></i></div>
      <p class="num text-[64px] leading-none mt-6" style="color:var(--coral)">46<span class="text-[28px]">%</span></p>
      <p class="text-[15px] font-bold mt-1.5">正在贴图 · 马上就有质感了</p>
    </div>

    <!-- 阶段步进 -->
    <div class="stk p-3.5 mt-7">
      <div class="flex items-center justify-between">
        <div class="flex flex-col items-center gap-1.5 w-1/4"><span class="w-9 h-9 rounded-full border-2 border-[#1A1410] flex items-center justify-center text-[14px]" style="background:var(--sun)"><i class="fa-solid fa-check"></i></span><span class="text-[11px] font-extrabold">排队</span></div>
        <div class="flex-1 h-1 mx-1 rounded" style="background:var(--sun)"></div>
        <div class="flex flex-col items-center gap-1.5 w-1/4"><span class="w-9 h-9 rounded-full border-2 border-[#1A1410] flex items-center justify-center text-[14px]" style="background:var(--sun)"><i class="fa-solid fa-check"></i></span><span class="text-[11px] font-extrabold">建模</span></div>
        <div class="flex-1 h-1 mx-1 rounded" style="background:var(--sun)"></div>
        <div class="flex flex-col items-center gap-1.5 w-1/4"><span class="w-9 h-9 rounded-full border-2 border-[#1A1410] flex items-center justify-center" style="background:var(--coral)"><i class="fa-solid fa-palette text-white text-[13px]"></i></span><span class="text-[11px] font-extrabold text-[#FF6B4A]">贴图</span></div>
        <div class="flex-1 h-1 mx-1 rounded" style="background:#EFE0D2"></div>
        <div class="flex flex-col items-center gap-1.5 w-1/4"><span class="w-9 h-9 rounded-full border-2 border-[#1A1410] bg-white flex items-center justify-center text-[13px] text-[#6F6259]">…</span><span class="text-[11px] font-extrabold text-[#6F6259]">完成</span></div>
      </div>
      <div class="h-[14px] rounded-full border-2 border-[#1A1410] overflow-hidden mt-4" style="background:#fff">
        <div class="h-full rounded-full" style="width:46%;background:linear-gradient(90deg,#FF6B4A,#FFB347)"></div>
      </div>
    </div>

    <button class="btn-hard w-full h-[44px] text-[15px] mt-4 bg-white"><i class="fa-solid fa-ban text-[13px]"></i>取消生成</button>
    <p class="text-center text-[12px] text-[#6F6259] font-semibold mt-2">取消将按已生成进度比例退还 Token(二次确认)</p>

    <!-- 状态样式:取消确认 / 失败退款 / 弱网 -->
    <div class="spec mt-4">
      <span class="spec-lbl"><i class="fa-solid fa-hourglass-end"></i>状态样式 · 取消与失败(E13 / E14)</span>
      <div class="mt-3 space-y-2.5">
        <div class="rounded-[16px] border-2 border-[#1A1410] bg-white p-3.5 text-center">
          <p class="text-[14px] font-black">已生成 46%,确认取消?</p>
          <p class="text-[12px] font-semibold text-[#6F6259] mt-1">将退还 <span class="num" style="color:#0E7F78">+2</span> Token(按进度比例)</p>
          <div class="flex gap-2 mt-2.5"><button class="btn-hard flex-1 h-[38px] text-[13px] bg-white">继续生成</button><button class="btn-hard flex-1 h-[38px] text-[13px] text-white" style="background:var(--ink)">确认取消</button></div>
        </div>
        <div class="rounded-[16px] border-2 border-[#1A1410] p-3.5" style="background:rgba(232,70,58,.08)">
          <p class="text-[14px] font-black"><i class="fa-solid fa-face-sad-tear" style="color:#E8463A"></i> 生成失败了:服务繁忙</p>
          <p class="text-[12px] font-semibold mt-1">已全额退还 <span class="num">+4</span> Token · 照片特征不足时也会提示换图</p>
          <button class="btn-hard h-[38px] px-5 text-[13px] mt-2.5 bg-white"><i class="fa-solid fa-rotate-right text-[11px]"></i>重试(无需重新配置)</button>
        </div>
        <div class="rounded-[14px] border-2 border-[#1A1410] px-3 py-2.5 flex items-center gap-2.5" style="background:rgba(78,205,196,.15)">
          <span class="text-[16px] shrink-0"><i class="fa-solid fa-signal"></i></span><p class="text-[13px] font-bold">弱网:转为轮询兜底,恢复后自动续传进度</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部手势条(D-063) -->
  <div class="shrink-0 bg-[#FFF9F5] pb-1.5 pt-0"><div class="mx-auto w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div></div>
</div>
</body>
</html>
