<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S27 模型详情(P1) · VR留念</title>
<!-- 字号 px 等值;FR-09/08/12:Token/积分 10:1;下载确认;余额引导;点赞两态;举报;D-063:FA 图标(A-732) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-4">
    <div class="flex items-center gap-2.5 mt-1">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[22px] font-black truncate">猫猫邮差</h1>
      <!-- G1 余额胶囊(D-029) -->
      <span class="chip ml-auto shrink-0" style="background:rgba(255,107,74,.12);color:#C2410C"><i class="fa-solid fa-coins text-[11px]"></i>80</span>
    </div>

    <!-- 大图预览 + 四视角缩略(设计选择:平涂渐变+FA 图标示意,非占位符) -->
    <div class="mt-4 rounded-[24px] border-2 border-[#1A1410] h-[210px] flex items-center justify-center relative text-white" style="background:linear-gradient(150deg,#FF8A6E,#FFB347);box-shadow:5px 5px 0 #1A1410">
      <span class="text-[76px]"><i class="fa-solid fa-cat"></i></span>
      <span class="chip absolute top-3 right-3 bg-white"><i class="fa-solid fa-robot text-[10px]"></i>AI 生成</span>
      <span class="chip absolute top-3 left-3 text-white" style="background:var(--coral)"><i class="fa-solid fa-cube text-[10px]"></i>模型</span>
    </div>
    <div class="flex gap-2 mt-3">
      <div class="w-[54px] h-[54px] rounded-[12px] border-2 border-[#1A1410] bg-white flex items-center justify-center text-[22px]" style="color:#C2410C"><i class="fa-solid fa-cat"></i></div>
      <div class="w-[54px] h-[54px] rounded-[12px] border-2 border-[#1A1410] bg-white flex items-center justify-center text-[22px] rotate-12" style="color:#C2410C"><i class="fa-solid fa-cat"></i></div>
      <div class="w-[54px] h-[54px] rounded-[12px] border-2 border-[#1A1410] bg-white flex items-center justify-center text-[22px] rotate-180" style="color:#C2410C"><i class="fa-solid fa-cat"></i></div>
      <div class="w-[54px] h-[54px] rounded-[12px] border-2 border-[#1A1410] bg-white flex items-center justify-center text-[22px] -rotate-12" style="color:#C2410C"><i class="fa-solid fa-cat"></i></div>
      <p class="text-[11px] text-[#6F6259] font-semibold self-end ml-1">四视角 · 可 3D 预览旋转</p>
    </div>

    <!-- 创作者与数据 -->
    <div class="stk p-3.5 mt-4 flex items-center gap-3">
      <div class="w-11 h-11 rounded-full border-2 border-[#1A1410] flex items-center justify-center text-[20px] shrink-0" style="background:var(--sun)"><i class="fa-solid fa-certificate"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[15px] font-black">官方精选</p>
        <p class="text-[12px] text-[#6F6259] font-semibold"><i class="fa-solid fa-download text-[10px]"></i> 下载 1,240 · <i class="fa-regular fa-heart text-[10px]" style="color:#FF6B4A"></i> 点赞 88 · 上架于 07-18</p>
      </div>
      <!-- 点赞:默认/已赞两态并列(技能规则) -->
      <button class="chip bg-white shrink-0"><i class="fa-regular fa-heart text-[11px]" style="color:#FF6B4A"></i>88</button>
      <button class="chip shrink-0 text-white" style="background:var(--coral)"><i class="fa-solid fa-heart text-[11px]"></i>89</button>
    </div>

    <!-- 支付方式 -->
    <p class="lbl mt-5 mb-2">用什么换</p>
    <div class="grid grid-cols-2 gap-2.5">
      <div class="rounded-[18px] border-2 border-[#1A1410] p-3.5" style="background:rgba(255,107,74,.12)">
        <div class="flex items-center justify-between"><span class="text-[15px] font-black"><i class="fa-solid fa-coins text-[13px]" style="color:#B45309"></i> Token</span><span class="w-6 h-6 rounded-full border-2 border-[#1A1410] flex items-center justify-center" style="background:var(--coral)"><i class="fa-solid fa-check text-white text-[11px]"></i></span></div>
        <p class="num text-[24px] mt-1">−4</p>
        <p class="text-[11px] font-semibold text-[#6F6259]">余额 80,足够</p>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] bg-white p-3.5">
        <div class="flex items-center justify-between"><span class="text-[15px] font-black"><i class="fa-solid fa-star text-[13px]" style="color:#B45309"></i> 积分抵扣</span><span class="w-6 h-6 rounded-full border-2 border-[#1A1410] bg-white"></span></div>
        <p class="num text-[24px] mt-1">−40</p>
        <p class="text-[11px] font-semibold text-[#6F6259]">10 积分 ≈ 1 Token</p>
      </div>
    </div>

    <!-- 下载确认(显示本次消耗) -->
    <button class="btn-hard w-full h-[52px] text-[17px] text-white mt-4" style="background:var(--coral)"><i class="fa-solid fa-download"></i>下载 · 本次消耗 4 Token</button>
    <button class="w-full h-[40px] mt-3 text-[13px] font-extrabold" style="color:#E8463A"><i class="fa-solid fa-flag text-[12px]"></i> 举报这个模型</button>

    <!-- 状态样式:余额不足 / 已下载 / 已下架 -->
    <div class="spec mt-3">
      <span class="spec-lbl"><i class="fa-solid fa-circle-exclamation"></i>状态样式 · 下载边界(E15 / E24)</span>
      <div class="mt-3 space-y-2.5">
        <div class="rounded-[16px] border-2 border-[#1A1410] bg-white p-3.5 flex items-center gap-3">
          <span class="text-[20px] shrink-0" style="color:#B45309"><i class="fa-solid fa-coins"></i></span>
          <p class="text-[13px] font-bold flex-1">Token 不足:提示赠送途径,或切到积分抵扣(无购买按钮,D-023)</p>
        </div>
        <div class="rounded-[16px] border-2 border-[#1A1410] p-3.5 flex items-center gap-3" style="background:rgba(29,201,129,.1)">
          <span class="text-[20px] shrink-0" style="color:#0C8A57"><i class="fa-solid fa-circle-check"></i></span>
          <p class="text-[13px] font-bold flex-1">已下载:按钮变「直接使用」,进放置/同框流</p>
        </div>
        <div class="rounded-[16px] border-2 border-[#1A1410] p-3.5 flex items-center gap-3" style="background:#EFE0D2">
          <span class="text-[20px] shrink-0" style="color:#B4A79D"><i class="fa-solid fa-ban"></i></span>
          <p class="text-[13px] font-bold flex-1" style="color:#B4A79D">已下架:详情只读;已下载的本地保留可继续用</p>
        </div>
      </div>
    </div>
  </main>

  <!-- TabBar(A-701:Tab3 激活) -->
  <nav class="shrink-0 bg-white border-t-2 border-[#1A1410] px-3 pt-1.5" style="box-shadow:0 -8px 24px rgba(26,20,16,.12)">
    <div class="grid grid-cols-4 items-end">
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-[#6F6259] text-[14px]"><i class="fa-solid fa-map-location-dot"></i></span>
        <span class="text-[10px] font-extrabold text-[#6F6259]">地图</span>
      </div>
      <div class="relative flex flex-col items-center">
        <span class="absolute -top-[30px] w-[56px] h-[56px] rounded-full border-2 border-[#1A1410] flex items-center justify-center text-white text-[19px]" style="background:linear-gradient(135deg,#FF6B4A,#FFB347);box-shadow:4px 4px 0 #1A1410,inset 0 0 0 3px rgba(255,255,255,.85)"><i class="fa-solid fa-camera"></i></span>
        <span class="mt-[30px] text-[10px] font-extrabold text-[#6F6259] pb-1.5">AR 相机</span>
      </div>
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-white text-[14px] border-2 border-[#1A1410]" style="background:var(--coral)"><i class="fa-solid fa-store"></i></span>
        <span class="text-[10px] font-extrabold text-[#FF6B4A]">商店</span>
      </div>
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-[#6F6259] text-[14px]"><i class="fa-solid fa-user"></i></span>
        <span class="text-[10px] font-extrabold text-[#6F6259]">我的</span>
      </div>
    </div>
    <div class="mx-auto mt-1 mb-1.5 w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div>
  </nav>
</div>
</body>
</html>
