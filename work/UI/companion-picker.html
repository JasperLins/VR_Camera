<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S18 同框角色面板(P1) · VR留念</title>
<!-- 字号 px 等值;FR-11:双 Tab;已选 ≤2(5.10);伦理常驻;D-063:FA 图标统一+真实化形象名(A-732/735) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.seg{border:2px solid var(--ink);border-radius:999px;padding:3px;display:flex;gap:2px;background:#fff}
.seg span{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}
.seg-on{background:var(--coral);color:#fff}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <!-- 底部弹层式面板(Z5) -->
  <main class="flex-1 overflow-y-auto bg-white border-t-2 border-[#1A1410] rounded-t-[28px] px-4 pt-2.5 pb-6" style="box-shadow:0 -8px 24px rgba(26,20,16,.2)">
    <div class="w-9 h-1.5 rounded-full bg-[#1A1410]/20 mx-auto"></div>
    <div class="flex items-center gap-2.5 mt-3">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[21px] font-black">拉谁同框?</h1>
      <!-- 已选 ≤2(5.10) -->
      <span class="chip ml-auto shrink-0" style="background:rgba(255,107,74,.12);color:#C2410C">已选 2 / 2</span>
    </div>

    <!-- 双 Tab 分段 -->
    <div class="seg mt-4">
      <span class="seg-on flex-1 text-center">官方虚拟形象库</span>
      <span class="flex-1 text-center text-[#6F6259]">我的虚拟好友</span>
    </div>

    <!-- 官方形象卡栅格(设计选择:平涂底+FA 图标示意形象,非占位符)+ 真实化命名 -->
    <div class="grid grid-cols-3 gap-2.5 mt-4">
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center" style="background:rgba(255,179,71,.18);color:#B45309">
        <div class="text-[32px]"><i class="fa-solid fa-dragon"></i></div><p class="text-[12px] font-extrabold mt-1">龙宝</p>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center" style="background:rgba(255,107,74,.12);color:#C2410C">
        <div class="text-[32px]"><i class="fa-solid fa-otter"></i></div>
        <div class="flex items-center justify-center gap-1 mt-1"><p class="text-[12px] font-extrabold">水獭淘淘</p><span class="w-4 h-4 rounded-full border-2 border-[#1A1410] flex items-center justify-center" style="background:var(--coral)"><i class="fa-solid fa-check text-white text-[8px]"></i></span></div>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center bg-white opacity-50" style="color:#6F6259">
        <div class="text-[32px]"><i class="fa-solid fa-hippo"></i></div><p class="text-[12px] font-extrabold mt-1">河马墩墩</p>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center bg-white" style="color:#0E7F78">
        <div class="text-[32px]"><i class="fa-solid fa-robot"></i></div><p class="text-[12px] font-extrabold mt-1">铁皮</p>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center" style="background:rgba(78,205,196,.15);color:#0E7F78">
        <div class="text-[32px]"><i class="fa-solid fa-fish"></i></div>
        <div class="flex items-center justify-center gap-1 mt-1"><p class="text-[12px] font-extrabold">小蓝</p><span class="w-4 h-4 rounded-full border-2 border-[#1A1410] flex items-center justify-center" style="background:var(--coral)"><i class="fa-solid fa-check text-white text-[8px]"></i></span></div>
      </div>
      <div class="rounded-[18px] border-2 border-[#1A1410] p-2.5 text-center bg-white opacity-50" style="color:#6F6259">
        <div class="text-[32px]"><i class="fa-solid fa-dove"></i></div><p class="text-[12px] font-extrabold mt-1">白鸽咕咕</p>
      </div>
    </div>

    <!-- 已选列表(上限 2,满员后其余卡片置灰) -->
    <p class="lbl mt-5 mb-2">本次同框(最多 2 个)</p>
    <div class="stk p-3 flex items-center gap-3">
      <div class="w-11 h-11 rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[22px] text-white" style="background:linear-gradient(135deg,#FF8A6E,#FFB347)"><i class="fa-solid fa-otter"></i></div>
      <p class="text-[14px] font-extrabold flex-1">水獭淘淘<span class="text-[11px] font-bold text-[#6F6259] ml-1.5">官方形象</span></p>
      <button class="chip bg-white shrink-0" style="color:#E8463A"><i class="fa-solid fa-xmark text-[10px]"></i>移除</button>
    </div>
    <div class="stk p-3 flex items-center gap-3 mt-2.5">
      <div class="w-11 h-11 rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[22px] text-white" style="background:linear-gradient(135deg,#7EDDD6,#4ECDC4)"><i class="fa-solid fa-fish"></i></div>
      <p class="text-[14px] font-extrabold flex-1">小蓝<span class="text-[11px] font-bold text-[#6F6259] ml-1.5">官方形象</span></p>
      <button class="chip bg-white shrink-0" style="color:#E8463A"><i class="fa-solid fa-xmark text-[10px]"></i>移除</button>
    </div>
    <p class="text-[12px] text-[#6F6259] font-semibold mt-2">已满 2 个,其他形象自动置灰;到取景框里拖动站位、旋转朝向</p>

    <!-- 伦理常驻提示 + 举报 -->
    <div class="mt-4 rounded-[20px] border-2 border-[#1A1410] px-4 py-3 flex items-start gap-3" style="background:rgba(245,158,11,.12)">
      <span class="text-[20px] shrink-0"><i class="fa-solid fa-handshake"></i></span>
      <div class="min-w-0">
        <p class="text-[13px] font-black">同框仅限:本人 或 已获得同意的亲友</p>
        <p class="text-[12px] font-semibold text-[#6F6259] mt-0.5">滥用他人形象可被举报 · <span class="underline decoration-2 decoration-[#B45309]">举报入口</span></p>
      </div>
    </div>

    <button class="btn-hard w-full h-[48px] text-[16px] text-white mt-4" style="background:var(--coral)">回到取景框</button>

    <!-- 状态样式 -->
    <div class="spec mt-4">
      <span class="spec-lbl"><i class="fa-solid fa-box-open"></i>状态样式 · 我的虚拟好友空态 / 低端限 1(E22)</span>
      <div class="mt-3 space-y-2.5">
        <div class="rounded-[16px] border-2 border-[#1A1410] bg-white p-3.5 flex items-center gap-3">
          <div class="stk-sm w-12 h-12 flex items-center justify-center text-[24px] -rotate-3 shrink-0" style="color:#6F6259"><i class="fa-solid fa-user-group"></i></div>
          <div class="flex-1 min-w-0"><p class="text-[14px] font-bold">还没有虚拟好友</p><p class="text-[12px] text-[#6F6259] font-semibold">用亲友照片生成,复制「我的模型」链路</p></div>
          <button class="btn-hard h-[36px] px-3.5 text-[12px] text-white shrink-0" style="background:var(--coral)">去生成</button>
        </div>
        <div class="rounded-[14px] border-2 border-[#1A1410] px-3 py-2.5 flex items-center gap-2.5" style="background:rgba(255,179,71,.12)">
          <span class="text-[16px] shrink-0"><i class="fa-solid fa-battery-quarter"></i></span><p class="text-[13px] font-bold">低端设备:仅支持 1 个同框角色,第二个卡位置灰</p>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部手势条(D-063) -->
  <div class="shrink-0 bg-white pb-1.5 pt-0"><div class="mx-auto w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div></div>
</div>
</body>
</html>
