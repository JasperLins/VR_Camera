<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S11 内容来源选择 · VR留念</title>
<!-- 字号 px 等值;Z5 底部弹层:三路径;D-063:FA 图标统一(A-732)+ 搜索聚焦态 + 真实化模型名(A-735) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.caret{display:inline-block;width:2px;height:16px;background:var(--coral);animation:caret 1s step-end infinite;vertical-align:-3px;margin-left:2px}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <!-- 底部弹层式内容区(Z5) -->
  <main class="flex-1 overflow-y-auto bg-white border-t-2 border-[#1A1410] rounded-t-[28px] px-4 pt-2.5 pb-6" style="box-shadow:0 -8px 24px rgba(26,20,16,.2)">
    <div class="w-9 h-1.5 rounded-full bg-[#1A1410]/20 mx-auto"></div>
    <div class="flex items-center gap-2.5 mt-3">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[22px] font-black">放点什么好?</h1>
    </div>
    <p class="text-[13px] text-[#6F6259] font-semibold mt-1 ml-[46px]">三条路,都能把内容放到刚才的位置</p>

    <!-- 搜索:D-063 输入聚焦态(输入中 + 光标 + 联想词) -->
    <div class="mt-4 rounded-[14px] border-2 border-[#FF6B4A] bg-white px-3 h-[44px] flex items-center gap-2" style="box-shadow:2px 2px 0 rgba(255,107,74,.25)">
      <i class="fa-solid fa-magnifying-glass text-[#FF6B4A]"></i>
      <span class="text-[14px] font-bold">毕业<span class="caret"></span></span>
      <span class="chip ml-auto shrink-0" style="background:rgba(78,205,196,.15);color:#0E7F78"><i class="fa-solid fa-microphone text-[10px]"></i>语音</span>
    </div>
    <div class="flex gap-1.5 mt-2 flex-wrap">
      <span class="chip" style="background:rgba(255,107,74,.12);color:#C2410C">🎓 毕业快乐 2026</span>
      <span class="chip bg-white">学士帽烟花</span>
      <span class="chip bg-white">校园纪念柱</span>
    </div>

    <!-- 三路径撞色块卡 -->
    <div class="mt-4 rounded-[20px] border-2 border-[#1A1410] p-4" style="background:rgba(255,179,71,.18)">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-[16px] border-2 border-[#1A1410] flex items-center justify-center text-[26px] bg-white rotate-2 shrink-0" style="color:#B45309"><i class="fa-solid fa-gift"></i></div>
        <div class="flex-1 min-w-0">
          <h2 class="text-[17px] font-black">官方库</h2>
          <p class="text-[12px] font-semibold text-[#6F6259]">现成的节日 / 情绪小模型,即选即放</p>
        </div>
        <i class="fa-solid fa-chevron-right text-[#6F6259] shrink-0"></i>
      </div>
      <div class="flex gap-1.5 mt-3 flex-wrap">
        <span class="chip bg-white"><i class="fa-solid fa-champagne-glasses text-[11px]"></i>节日</span>
        <span class="chip bg-white"><i class="fa-solid fa-heart text-[11px]" style="color:#E8463A"></i>情绪</span>
        <span class="chip bg-white"><i class="fa-solid fa-tower-observation text-[11px]"></i>地标</span>
        <span class="chip bg-white"><i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i>装饰</span>
      </div>
    </div>

    <div class="mt-3.5 rounded-[20px] border-2 border-[#1A1410] p-4" style="background:rgba(78,205,196,.15)">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-[16px] border-2 border-[#1A1410] flex items-center justify-center text-[26px] bg-white -rotate-2 shrink-0" style="color:#0E7F78"><i class="fa-solid fa-cube"></i></div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2"><h2 class="text-[17px] font-black">我的模型</h2><span class="chip bg-white">6 个可用</span></div>
          <p class="text-[12px] font-semibold text-[#6F6259]">已生成 / 已上传的模型</p>
        </div>
        <i class="fa-solid fa-chevron-right text-[#6F6259] shrink-0"></i>
      </div>
      <!-- 模型缩略(设计选择:类型色渐变底 + FA 图标示意,非占位符)+ 真实化命名 -->
      <div class="grid grid-cols-4 gap-2 mt-3">
        <div><div class="h-[62px] rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[24px]" style="background:linear-gradient(135deg,#FF8A6E,#FFB347);color:#fff"><i class="fa-solid fa-dragon"></i></div><p class="text-[10px] font-extrabold text-center mt-1 truncate">时光鹿·官</p></div>
        <div><div class="h-[62px] rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[24px]" style="background:linear-gradient(135deg,#7EDDD6,#4ECDC4);color:#fff"><i class="fa-solid fa-otter"></i></div><p class="text-[10px] font-extrabold text-center mt-1 truncate">鲸鱼阿北</p></div>
        <div><div class="h-[62px] rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[24px]" style="background:linear-gradient(135deg,#FFD98E,#F59E0B);color:#fff"><i class="fa-solid fa-cake-candles"></i></div><p class="text-[10px] font-extrabold text-center mt-1 truncate">生日蜡烛</p></div>
        <div><div class="h-[62px] rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[24px]" style="background:linear-gradient(135deg,#FF6B4A,#F05A38);color:#fff"><i class="fa-solid fa-robot"></i></div><p class="text-[10px] font-extrabold text-center mt-1 truncate">小满·Q版</p></div>
      </div>
    </div>

    <div class="mt-3.5 rounded-[20px] border-2 border-[#1A1410] p-4" style="background:rgba(255,107,74,.12)">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-[16px] border-2 border-[#1A1410] flex items-center justify-center text-[26px] bg-white rotate-1 shrink-0" style="color:#C2410C"><i class="fa-solid fa-camera-retro"></i></div>
        <div class="flex-1 min-w-0">
          <h2 class="text-[17px] font-black">照片生成 3D</h2>
          <p class="text-[12px] font-semibold text-[#6F6259]">一张照片 → 站立的形象(消耗 Token)</p>
        </div>
        <span class="chip text-white shrink-0" style="background:var(--coral)">去生成</span>
      </div>
    </div>

    <p class="text-[12px] text-[#6F6259] font-semibold mt-3"><i class="fa-solid fa-lock text-[11px]"></i> 选「私密」放置时,将先进入授权好友选择器</p>

    <!-- 空态:我的模型 -->
    <div class="spec mt-4">
      <span class="spec-lbl"><i class="fa-solid fa-box-open"></i>状态样式 · 我的模型为空</span>
      <div class="flex items-center gap-3 mt-3">
        <div class="stk-sm w-14 h-14 flex items-center justify-center text-[24px] -rotate-3 shrink-0" style="color:#6F6259"><i class="fa-solid fa-box-open"></i></div>
        <div class="flex-1 min-w-0"><p class="text-[14px] font-bold">模型仓库空空如也</p><p class="text-[12px] text-[#6F6259] font-semibold">用照片生成第一个,放置更带感</p></div>
        <button class="btn-hard h-[38px] px-4 text-[13px] text-white shrink-0" style="background:var(--coral)">去生成</button>
      </div>
      <p class="text-[12px] text-[#6F6259] font-semibold mt-2.5">官方库加载失败:显示重试按钮,不影响另两条路径</p>
    </div>
  </main>

  <!-- 底部手势条(D-063) -->
  <div class="shrink-0 bg-white pb-1.5 pt-0"><div class="mx-auto w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div></div>
</div>
</body>
</html>
