<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S28 分享上架(P1) · VR留念</title>
<!-- 字号 px 等值;FR-09/FR-12:分享权声明;提交审核;待审/已上架/驳回;D-063:FA 图标(A-732) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-4">
    <div class="flex items-center gap-2.5 mt-1">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[22px] font-black">上架到商店</h1>
    </div>

    <!-- 分享权声明(版权第四层防线) -->
    <div class="mt-4 rounded-[20px] border-2 border-[#1A1410] px-4 py-3.5" style="background:rgba(245,158,11,.12)">
      <p class="text-[14px] font-black"><i class="fa-solid fa-file-signature text-[13px]"></i> 上架前先声明</p>
      <div class="space-y-2.5 mt-3">
        <label class="flex items-start gap-2.5">
          <span class="shrink-0 w-6 h-6 rounded-lg border-2 border-[#1A1410] flex items-center justify-center mt-0.5" style="background:var(--coral)"><i class="fa-solid fa-check text-white text-[11px]"></i></span>
          <span class="text-[13px] font-bold">作品为我本人原创</span>
        </label>
        <label class="flex items-start gap-2.5">
          <span class="shrink-0 w-6 h-6 rounded-lg border-2 border-[#1A1410] flex items-center justify-center mt-0.5" style="background:var(--coral)"><i class="fa-solid fa-check text-white text-[11px]"></i></span>
          <span class="text-[13px] font-bold">我有权将其分享给他人使用(不含第三方权益内容)</span>
        </label>
      </div>
      <p class="text-[11px] font-semibold text-[#6F6259] mt-2.5">虚假声明将被下架;举报下架不追回已得积分,规则见商店页</p>
    </div>

    <!-- 从我的模型选择 -->
    <p class="lbl mt-5 mb-2">选择作品</p>
    <div class="stk p-3.5 flex items-center gap-3">
      <div class="w-[56px] h-[56px] rounded-[14px] border-2 border-[#1A1410] flex items-center justify-center text-[26px] shrink-0 text-white" style="background:linear-gradient(135deg,#7EDDD6,#4ECDC4)"><i class="fa-solid fa-otter"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[15px] font-black truncate">鲸鱼阿北</p>
        <p class="text-[12px] text-[#6F6259] font-semibold">Q 版 · 哑光 · 含 AI 生成标识 · 生成于 08-19</p>
      </div>
      <button class="chip bg-white shrink-0">换一个</button>
    </div>

    <!-- 收益说明 -->
    <div class="mt-3.5 rounded-[20px] border-2 border-[#1A1410] px-4 py-3.5 flex items-center gap-3" style="background:rgba(78,205,196,.15)">
      <div class="stk-sm w-12 h-12 flex items-center justify-center text-[22px] rotate-3 shrink-0" style="color:#0E7F78"><i class="fa-solid fa-sack-dollar"></i></div>
      <div class="min-w-0">
        <p class="text-[14px] font-black">被下载 1 次 = 5 积分(同一用户每周去重)</p>
        <p class="text-[12px] font-semibold text-[#6F6259] mt-0.5">流水在钱包可见;10 积分 ≈ 1 Token,可抵扣其他社区模型</p>
      </div>
    </div>

    <button class="btn-hard w-full h-[52px] text-[17px] text-white mt-5" style="background:var(--coral)"><i class="fa-solid fa-upload"></i>提交审核</button>
    <p class="text-center text-[12px] text-[#6F6259] font-semibold mt-2">机审 + 人工抽检,通过后自动上架</p>

    <!-- 状态样式 -->
    <div class="spec mt-4">
      <span class="spec-lbl"><i class="fa-solid fa-clipboard-check"></i>状态样式 · 审核流转</span>
      <div class="mt-3 space-y-2.5">
        <div class="rounded-[16px] border-2 border-[#1A1410] bg-white p-3.5 flex items-center gap-3">
          <span class="text-[20px] shrink-0" style="color:#B45309"><i class="fa-solid fa-hourglass-half"></i></span>
          <div class="flex-1 min-w-0"><p class="text-[14px] font-black">待审中</p><p class="text-[12px] text-[#6F6259] font-semibold">审核期间作品信息锁定禁改</p></div>
          <span class="chip shrink-0" style="background:rgba(255,179,71,.18)">审核中</span>
        </div>
        <div class="rounded-[16px] border-2 border-[#1A1410] p-3.5 flex items-center gap-3" style="background:rgba(29,201,129,.1)">
          <span class="text-[20px] shrink-0" style="color:#0C8A57"><i class="fa-solid fa-champagne-glasses"></i></span>
          <div class="flex-1 min-w-0"><p class="text-[14px] font-black">已上架</p><p class="text-[12px] text-[#6F6259] font-semibold">商店「我的创作」可见,数据实时更新</p></div>
        </div>
        <div class="rounded-[16px] border-2 border-[#1A1410] p-3.5" style="background:rgba(232,70,58,.08)">
          <p class="text-[14px] font-black"><i class="fa-solid fa-face-sad-tear" style="color:#E8463A"></i> 驳回:与现有作品相似度过高</p>
          <p class="text-[12px] font-semibold text-[#6F6259] mt-1">修改后可重新提交;对结果有异议可发起申诉,48h 内人工复核</p>
        </div>
      </div>
    </div>
  </main>

  <!-- TabBar(A-701:Tab3 激活) -->
  <nav class="shrink-0 bg-white border-t-2 border-[#1A1410] px-3 pt-1.5" style="box-shadow:0 -8px 24px rgba(26,20,16,.12)">
    <div class="grid grid-cols-4 items-end">
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-[#6F6259] text-[14px]"><i class="fa-solid fa-map-location-dot"></i></span>
        <span class="text-[10px] font-extrabold text-[#6F6259]">地图</span>
      </div>
      <div class="relative flex flex-col items-center">
        <span class="absolute -top-[30px] w-[56px] h-[56px] rounded-full border-2 border-[#1A1410] flex items-center justify-center text-white text-[19px]" style="background:linear-gradient(135deg,#FF6B4A,#FFB347);box-shadow:4px 4px 0 #1A1410,inset 0 0 0 3px rgba(255,255,255,.85)"><i class="fa-solid fa-camera"></i></span>
        <span class="mt-[30px] text-[10px] font-extrabold text-[#6F6259] pb-1.5">AR 相机</span>
      </div>
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-white text-[14px] border-2 border-[#1A1410]" style="background:var(--coral)"><i class="fa-solid fa-store"></i></span>
        <span class="text-[10px] font-extrabold text-[#FF6B4A]">商店</span>
      </div>
      <div class="flex flex-col items-center gap-1 pb-1.5">
        <span class="w-[42px] h-[30px] rounded-xl flex items-center justify-center text-[#6F6259] text-[14px]"><i class="fa-solid fa-user"></i></span>
        <span class="text-[10px] font-extrabold text-[#6F6259]">我的</span>
      </div>
    </div>
    <div class="mx-auto mt-1 mb-1.5 w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div>
  </nav>
</div>
</body>
</html>
