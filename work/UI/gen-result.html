<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S16 结果预览 · VR留念</title>
<!-- 字号 px 等值;FR-04:四视角快览→保存;重新生成再扣 4 Token;AI 生成标识;D-063:FA 图标+保存成功 Toast+系统自动命名(A-732/735) -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<style>
:root{--coral:#FF6B4A;--sun:#FFB347;--teal:#4ECDC4;--amber:#F59E0B;--ink:#1A1410;--ink2:#6F6259;--paper:#FFF9F5;--line:#EFE0D2}
html,body{margin:0;padding:0;background:var(--paper)}
body{font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box;overflow-wrap:anywhere}
.stage{width:100%;max-width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.stk{background:#fff;border:2px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 rgba(26,20,16,.92)}
.stk-sm{background:#fff;border:2px solid var(--ink);border-radius:14px;box-shadow:2px 2px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;line-height:1.25}
.btn-hard{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-radius:999px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease,box-shadow .12s ease;user-select:none;cursor:pointer}
.btn-hard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.spec{border:2px dashed var(--amber);border-radius:18px;background:rgba(245,158,11,.06);padding:12px}
.spec-lbl{display:inline-flex;align-items:center;gap:4px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800}
.wig{animation:wig 3.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:2px 2px 0 rgba(26,20,16,.3);z-index:40;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <header class="relative shrink-0 flex items-center justify-between px-6 pt-3.5 pb-1">
    <span class="num text-[15px]">9:41</span>
    <span class="absolute left-1/2 -translate-x-1/2 top-3 w-[96px] h-[27px] bg-[#1A1410] rounded-full"></span>
    <span class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[14px]"></i></span>
  </header>

  <main class="flex-1 overflow-y-auto px-4 pt-2 pb-6">
    <div class="flex items-center gap-2.5 mt-1">
      <button class="stk-sm w-9 h-9 flex items-center justify-center text-[13px]"><i class="fa-solid fa-chevron-left"></i></button>
      <h1 class="text-[22px] font-black">出炉啦!</h1>
      <span class="chip ml-auto shrink-0 bg-white"><i class="fa-solid fa-coins text-[11px]" style="color:#B45309"></i>已扣 4</span>
    </div>

    <div class="flex items-center gap-2 mt-2.5 flex-wrap">
      <span class="chip" style="background:rgba(255,179,71,.18)">Q 版 · 哑光 · 2K · PBR</span>
      <span class="chip bg-white"><i class="fa-solid fa-robot text-[11px]"></i>AI 生成</span>
      <span class="chip bg-white"><i class="fa-solid fa-tag text-[10px]"></i>自动命名:小满-Q版-0821</span>
    </div>

    <!-- 四视角宫格(设计选择:平涂渐变+FA 图标示意 3D,非占位符) -->
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="rounded-[20px] border-2 border-[#1A1410] h-[150px] flex flex-col items-center justify-center text-white" style="background:linear-gradient(160deg,#FF8A6E,#FFB347);box-shadow:4px 4px 0 #1A1410">
        <span class="text-[52px]"><i class="fa-solid fa-robot"></i></span><span class="chip bg-white mt-2">FRONT · 正面</span>
      </div>
      <div class="rounded-[20px] border-2 border-[#1A1410] h-[150px] flex flex-col items-center justify-center bg-white" style="color:#C2410C">
        <span class="text-[52px] rotate-12"><i class="fa-solid fa-robot"></i></span><span class="chip bg-white mt-2">RIGHT · 右侧</span>
      </div>
      <div class="rounded-[20px] border-2 border-[#1A1410] h-[150px] flex flex-col items-center justify-center bg-white" style="color:#C2410C">
        <span class="text-[52px] rotate-180"><i class="fa-solid fa-robot"></i></span><span class="chip bg-white mt-2">BACK · 背面</span>
      </div>
      <div class="rounded-[20px] border-2 border-[#1A1410] h-[150px] flex flex-col items-center justify-center bg-white" style="color:#C2410C">
        <span class="text-[52px] -rotate-12"><i class="fa-solid fa-robot"></i></span><span class="chip bg-white mt-2">LEFT · 左侧</span>
      </div>
    </div>

    <!-- 隐私即删提示 -->
    <div class="mt-4 rounded-[20px] border-2 border-[#1A1410] px-4 py-3 flex items-center gap-3" style="background:rgba(78,205,196,.15)">
      <span class="text-[20px] wig shrink-0">🫧</span>
      <p class="text-[13px] font-bold">原始照片已删除,只保留生成结果</p>
    </div>

    <!-- 动作区 -->
    <button class="btn-hard w-full h-[52px] text-[17px] text-white mt-4" style="background:var(--coral)"><i class="fa-solid fa-download"></i>保存到我的模型</button>
    <div class="flex gap-2.5 mt-3">
      <button class="btn-hard flex-1 h-[44px] text-[14px] bg-white"><i class="fa-solid fa-wand-magic-sparkles text-[12px]"></i>重新生成 −4</button>
      <button class="btn-hard flex-1 h-[44px] text-[14px] bg-white"><i class="fa-solid fa-location-dot text-[12px]"></i>去放置</button>
    </div>
    <button class="btn-hard w-full h-[42px] text-[14px] mt-3" style="background:rgba(255,179,71,.35)"><i class="fa-solid fa-store text-[12px]"></i>分享到商店赚积分(P1)</button>

    <!-- 状态样式 -->
    <div class="spec mt-4">
      <span class="spec-lbl"><i class="fa-solid fa-scissors"></i>状态样式 · 边界</span>
      <div class="mt-3 space-y-2">
        <div class="rounded-[14px] border-2 border-[#1A1410] px-3 py-2.5 flex items-center gap-2.5" style="background:rgba(255,179,71,.12)">
          <span class="text-[16px] shrink-0"><i class="fa-solid fa-screwdriver-wrench"></i></span><p class="text-[13px] font-bold">质量不合格:系统自动免费重试一次,无需再扣 Token</p>
        </div>
        <div class="rounded-[14px] border-2 border-[#1A1410] px-3 py-2.5 bg-white flex items-center gap-2.5">
          <span class="text-[16px] shrink-0"><i class="fa-solid fa-floppy-disk"></i></span><p class="text-[13px] font-bold">保存失败:结果暂存本会话,可点重试,退出前不丢失</p>
        </div>
      </div>
    </div>
  </main>

  <!-- D-063 全局反馈:保存成功 Toast(≤2s) -->
  <div class="toast"><i class="fa-solid fa-circle-check" style="color:#3BE39A"></i>已存入「我的模型」· 照片已删除</div>

  <!-- 底部手势条(D-063) -->
  <div class="shrink-0 bg-[#FFF9F5] pb-1.5 pt-0"><div class="mx-auto w-[124px] h-[5px] rounded-full bg-[#1A1410]"></div></div>
</div>
</body>
</html>
